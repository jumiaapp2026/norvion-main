<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Norvion Bulk STK Push Bot</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --border: #334155;
      --text: #f8fafc;
      --muted: #94a3b8;
      --primary: #10b981;
      --primary-hover: #059669;
      --danger: #ef4444;
      --warn: #f59e0b;
    }
    * { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
    body {
      background: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 2rem 1rem;
      display: flex;
      justify-content: center;
    }
    .container { width: 100%; max-width: 820px; display: grid; gap: 1.25rem; }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 1.5rem;
    }
    h1 { margin: 0 0 0.25rem; font-size: 1.4rem; }
    p.sub { margin: 0 0 1.25rem; color: var(--muted); font-size: 0.9rem; }
    label { display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 0.4rem; color: #cbd5e1; }
    textarea, input {
      width: 100%;
      background: #0f172a;
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 6px;
      padding: 0.65rem 0.8rem;
      font-size: 0.95rem;
      margin-bottom: 1rem;
    }
    textarea { min-height: 150px; font-family: ui-monospace, monospace; resize: vertical; }
    .row { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 1rem; }
    @media (max-width: 650px) { .row { grid-template-columns: 1fr; } }
    .actions { display: flex; gap: 0.75rem; align-items: center; }
    button {
      border: none;
      border-radius: 6px;
      padding: 0.7rem 1.25rem;
      font-weight: 600;
      cursor: pointer;
      font-size: 0.95rem;
    }
    #startBtn { background: var(--primary); color: #052e16; }
    #startBtn:hover:not(:disabled) { background: var(--primary-hover); color: #fff; }
    #stopBtn { background: var(--danger); color: #fff; }
    button:disabled { opacity: 0.45; cursor: not-allowed; }
    .stats {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 0.75rem;
      text-align: center;
    }
    .stat-box { background: #0f172a; padding: 0.75rem; border-radius: 6px; border: 1px solid var(--border); }
    .stat-val { font-size: 1.35rem; font-weight: 700; }
    .stat-lbl { font-size: 0.75rem; color: var(--muted); text-transform: uppercase; }
    .log-box {
      background: #020617;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 0.85rem;
      height: 280px;
      overflow-y: auto;
      font-family: ui-monospace, monospace;
      font-size: 0.82rem;
      line-height: 1.45;
    }
    .log-info { color: #38bdf8; }
    .log-warn { color: var(--warn); }
    .log-error { color: #f87171; }
    #banner { margin-top: 0.75rem; font-size: 0.88rem; }
  </style>
</head>
<body>
  <div class="container">
    <div class="card">
      <h1>Norvion M-Pesa STK Push Bot</h1>
      <p class="sub">Dispatches 1 STK push every <strong>4 seconds</strong>. Only numbers starting with <code>254</code> (12 digits) are accepted.</p>

      <label for="numbers">Bulk Phone Numbers (one per line, or comma/space separated)</label>
      <textarea id="numbers" placeholder="254712345678&#10;254798765432&#10;254110000000"></textarea>

      <div class="row">
        <div>
          <label for="amount">Amount (KES)</label>
          <input type="number" id="amount" value="100" min="1" max="250000" />
        </div>
        <div>
          <label for="prefix">Reference Prefix</label>
          <input type="text" id="prefix" value="INV-100" maxlength="80" />
        </div>
        <div>
          <label for="callback">Callback URL (Optional)</label>
          <input type="url" id="callback" placeholder="Uses server CALLBACK_URL if blank" />
        </div>
      </div>

      <div class="actions">
        <button id="startBtn" onclick="startBatch()">Start STK Bot</button>
        <button id="stopBtn" onclick="stopBatch()" disabled>Stop Batch</button>
      </div>
      <div id="banner"></div>
    </div>

    <div class="card">
      <div class="stats" style="margin-bottom: 1rem;">
        <div class="stat-box"><div class="stat-val" id="stTotal">0</div><div class="stat-lbl">Queued</div></div>
        <div class="stat-box"><div class="stat-val" id="stProc">0</div><div class="stat-lbl">Processed</div></div>
        <div class="stat-box"><div class="stat-val" style="color:#10b981" id="stOk">0</div><div class="stat-lbl">Sent</div></div>
        <div class="stat-box"><div class="stat-val" style="color:#ef4444" id="stErr">0</div><div class="stat-lbl">Errors</div></div>
      </div>

      <label>Live Execution & Error Logs (Mirrored to Render Logs)</label>
      <div class="log-box" id="logBox">Waiting for batch...</div>
    </div>
  </div>

  <script>
    const startBtn = document.getElementById('startBtn');
    const stopBtn = document.getElementById('stopBtn');
    const banner = document.getElementById('banner');

    async function startBatch() {
      banner.textContent = '';
      const payload = {
        numbersRaw: document.getElementById('numbers').value,
        amount: document.getElementById('amount').value,
        referencePrefix: document.getElementById('prefix').value,
        callbackUrl: document.getElementById('callback').value
      };

      const res = await fetch('/api/start', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });
      const data = await res.json();

      if (!res.ok) {
        banner.style.color = '#f87171';
        banner.textContent = `Error: ${data.error}` + (data.invalid ? ` (Invalid: ${data.invalid.join(', ')})` : '');
        return;
      }

      banner.style.color = '#34d399';
      banner.textContent = data.message + (data.invalidCount ? ` | Skipped ${data.invalidCount} invalid number(s).` : '');
      pollStatus();
    }

    async function stopBatch() {
      const res = await fetch('/api/stop', { method: 'POST' });
      const data = await res.json();
      banner.style.color = '#fbbf24';
      banner.textContent = data.message || data.error;
    }

    async function pollStatus() {
      try {
        const res = await fetch('/api/status');
        const state = await res.json();

        document.getElementById('stTotal').textContent = state.total;
        document.getElementById('stProc').textContent = state.processed;
        document.getElementById('stOk').textContent = state.succeeded;
        document.getElementById('stErr').textContent = state.failed;

        startBtn.disabled = state.running;
        stopBtn.disabled = !state.running;

        const logBox = document.getElementById('logBox');
        if (state.logs && state.logs.length > 0) {
          logBox.innerHTML = state.logs.map(l => {
            const cls = l.level === 'error' ? 'log-error' : l.level === 'warn' ? 'log-warn' : 'log-info';
            const metaStr = l.meta ? ` — ${JSON.stringify(l.meta)}` : '';
            return `<div class="${cls}">[${l.timestamp.split('T')[1].replace('Z','')}] [${l.level.toUpperCase()}] ${l.message}${metaStr}</div>`;
          }).join('');
        }
      } catch (e) {
        console.error('Status poll failed', e);
      }
    }

    setInterval(pollStatus, 2000);
    pollStatus();
  </script>
</body>
</html>
